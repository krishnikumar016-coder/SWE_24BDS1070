version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=super-secret-key-for-burnout-mvp-2026-change-in-prod
      - DATABASE_URL=sqlite:///./burnout_system.db
      - K_ANONYMITY_THRESHOLD=5
    volumes:
      - ./backend/burnout_system.db:/app/burnout_system.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
